plugins {
    id 'com.android.application'
}

// 优先从环境变量读取签名信息；本地开发仍可使用被 Git 忽略的 release.properties。
def releaseProperties = new java.util.Properties()
def releasePropertiesFile = rootProject.file('release.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName)?.trim() ?: releaseProperties.getProperty(propertyName)?.trim()
}
def releaseSigningValues = [
        storeFile: signingValue('ANDROID_KEYSTORE_PATH', 'storeFile'),
        storePassword: signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword'),
        keyAlias: signingValue('ANDROID_KEY_ALIAS', 'keyAlias'),
        keyPassword: signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
]
def releaseSigningConfigured = releaseSigningValues.values().every { value ->
    value != null && !value.isEmpty()
}
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(java.util.Locale.ROOT).contains('release')
}

android {
    namespace 'com.mysandbox.work'
    compileSdk 34

    defaultConfig {
        applicationId "com.mysandbox.work"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.3"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // 对外发布必须使用受控 release 签名，并且不允许调试。
            if (releaseTaskRequested && !releaseSigningConfigured) {
                throw new GradleException('Release signing is required. Create an ignored release.properties file from release.properties.example.')
            }
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
}

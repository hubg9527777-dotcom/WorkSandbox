plugins {
    id 'com.android.application'
}

// 仅从未纳入版本控制的 release.properties 读取本地签名信息。
def releaseProperties = new java.util.Properties()
def releasePropertiesFile = rootProject.file('release.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseSigningConfigured = releasePropertiesFile.exists() && [
        'storeFile', 'storePassword', 'keyAlias', 'keyPassword'
].every { key -> releaseProperties.getProperty(key)?.trim() }
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(java.util.Locale.ROOT).contains('release')
}

android {
    namespace 'com.mysandbox.work'
    compileSdk 34

    defaultConfig {
        applicationId "com.mysandbox.work"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.3"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // 对外发布必须使用受控 release 签名，并且不允许调试。
            if (releaseTaskRequested && !releaseSigningConfigured) {
                throw new GradleException('Release signing is required. Create an ignored release.properties file from release.properties.example.')
            }
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
}

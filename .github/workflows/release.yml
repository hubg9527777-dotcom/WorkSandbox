name: Release

on:
  push:
    tags:
      - 'v*'

# contents: write 用于创建 GitHub Release；其余权限仅用于生成并查询构件证明。
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build, attest and publish release APK
    runs-on: ubuntu-latest
    env:
      ASSET_NAME: WorkSandbox-${{ github.ref_name }}.apk
      RELEASE_APK: app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      # 私钥只从 GitHub Actions Secrets 读取，绝不写入仓库或 Release 资产。
      - name: Build and lint signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          KEYSTORE="$RUNNER_TEMP/worksandbox-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean lintRelease assembleRelease

      - name: Verify release APK security properties
        run: |
          test -f "$RELEASE_APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$BUILD_TOOLS_DIR/aapt"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$RELEASE_APK"
          if "$BUILD_TOOLS_DIR/aapt" dump badging "$RELEASE_APK" | grep -q 'application-debuggable'; then
            echo 'Release APK must not be debuggable.' >&2
            exit 1
          fi

      # 后续的证明与 Release 上传均只引用这一份不可再打包或改名的最终 APK。
      - name: Prepare final release asset
        run: |
          mkdir -p dist
          cp "$RELEASE_APK" "dist/$ASSET_NAME"
          test -s "dist/$ASSET_NAME"

      - name: Generate SLSA build provenance for final release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.ASSET_NAME }}

      # 先在 API 中验证同一最终文件的证明；失败则阻止创建没有证明的 Release。
      - name: Verify final asset attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh attestation verify "dist/$ASSET_NAME" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "Attestation not queryable yet; retrying in 10 seconds..." >&2
            sleep 10
          done
          exit 1

      - name: Create GitHub Release with attested asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$ASSET_NAME" \
            --title "WorkSandbox $GITHUB_REF_NAME" \
            --generate-notes
